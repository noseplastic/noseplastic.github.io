<h1>Personal rclone client</h1>
<p>This Google OAuth client is used by its owner to transfer their own files with <a href="https://rclone.org/">rclone</a>. It is not a public service and is not offered to anyone else.</p>
<p>It requests only the <code>drive.file</code> scope, which limits access to files the client itself creates.</p>
<p><a href="privacy.html">Privacy policy</a></p>
